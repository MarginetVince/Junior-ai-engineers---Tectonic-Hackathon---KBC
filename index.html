<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBC Gedragsanalyse Demo</title>
  <style>
    :root {
      --kbc-dark: #003665;
      --kbc-blue: #00aeef;
      --bg: #e9eef4;
      --grey: #6b7785;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 20px;
    }

    /* Demo user switcher (above the phone) */
    .switcher { display: flex; gap: 8px; }
    .switcher button {
      border: 2px solid var(--kbc-dark);
      background: #fff;
      color: var(--kbc-dark);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .switcher button.active { background: var(--kbc-dark); color: #fff; }

    /* Phone frame */
    .phone {
      width: 360px;
      max-width: 100%;
      height: 720px;
      background: #fff;
      border: 12px solid #1c1c1e;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 54, 101, 0.25);
    }
    .app-header {
      background: var(--kbc-dark);
      color: #fff;
      padding: 22px 20px 16px;
    }
    .app-header h1 { margin: 0; font-size: 20px; }
    .app-header p { margin: 4px 0 0; opacity: 0.8; font-size: 14px; }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f4f6f9;
    }

    .account {
      background: linear-gradient(135deg, var(--kbc-dark), #0a5aa0);
      color: #fff;
      border-radius: 16px;
      padding: 14px 18px;
    }
    .account .label { font-size: 13px; opacity: 0.8; }
    .account .balance { font-size: 24px; font-weight: 700; margin-top: 4px; }

    /* Recent activity card */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(0, 54, 101, 0.08);
    }
    .card-head { display: flex; justify-content: space-between; align-items: baseline; }
    h2 { font-size: 15px; color: var(--kbc-dark); margin: 0; }
    .card-head span { font-size: 12px; color: var(--grey); }
    .live { display: inline-flex; align-items: center; gap: 6px; color: #0089c2 !important; font-weight: 600; }
    .live i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--kbc-blue);
      animation: pulse 1s ease-in-out infinite;
    }

    .summary { display: flex; gap: 6px; margin: 10px 0 8px; }
    .chip {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      border-radius: 10px;
      background: #f2f5f9;
      font-size: 11px;
      color: var(--grey);
    }
    .chip b { display: block; font-size: 17px; color: var(--kbc-dark); }
    .chip.refresh { background: #e6f7fd; }
    .chip.refresh b { color: #0089c2; }

    .actions { list-style: none; margin: 0 -8px; padding: 0; }
    .actions li {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px;
      border-radius: 10px;
    }
    /* Vertical timeline line between icons */
    .actions li:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 23px;
      top: 34px;
      height: calc(100% - 26px);
      width: 2px;
      background: #e3e8ef;
    }
    .icon {
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .icon svg { width: 16px; height: 16px; }
    .icon.open { background: #e8f0f8; color: var(--kbc-dark); }
    .icon.close { background: #f0f1f3; color: var(--grey); }
    .icon.refresh { background: #e6f7fd; color: #0089c2; }
    .action-text { flex: 1; }
    .action-text div { font-size: 14px; color: #1d2733; font-weight: 500; }
    .action-text code { font-size: 10.5px; color: #9aa4b0; font-family: Consolas, monospace; }
    .tag {
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      background: var(--kbc-blue);
      padding: 3px 8px;
      border-radius: 10px;
    }
    .empty { font-size: 13px; color: var(--grey); text-align: center; padding: 12px 0; }

    .analyse {
      background: var(--kbc-blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .analyse:disabled { opacity: 0.6; cursor: wait; }

    /* Result states */
    .neutral { color: var(--grey); font-size: 13px; text-align: center; }
    .help {
      background: #e6f7fd;
      border-left: 4px solid var(--kbc-blue);
      border-radius: 12px;
      padding: 14px;
      color: var(--kbc-dark);
      font-size: 14px;
      line-height: 1.4;
    }
    .help strong { display: block; margin-bottom: 4px; }
    .reason { font-size: 12px; color: var(--grey); margin-top: 8px; }
    .error { color: #b00020; font-size: 13px; text-align: center; }

    /* --- Animations --- */
    .actions li.enter { animation: slide-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), flash 1.4s ease-out; }
    .actions li.enter .icon { animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1); }
    .actions li.leave { animation: fade-out 0.4s ease-in forwards; }
    .tag { animation: pop 0.4s ease-out; }
    .chip.bump { animation: bump 0.45s ease-out; }
    #result > * { animation: slide-up 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes flash {
      from { background: #d9f2fc; }
      to { background: transparent; }
    }
    @keyframes pop {
      from { transform: scale(0.3); }
      to { transform: scale(1); }
    }
    @keyframes fade-out {
      to { opacity: 0; transform: translateY(10px); }
    }
    @keyframes bump {
      40% { transform: scale(1.12); box-shadow: 0 0 0 3px rgba(0, 174, 239, 0.25); }
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      50% { opacity: 0.3; transform: scale(0.7); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="switcher" id="switcher"></div>

  <div class="phone">
    <div class="app-header">
      <h1>KBC Mobile</h1>
      <p id="greeting"></p>
    </div>
    <div class="content">
      <div class="account">
        <div class="label">Zichtrekening · BE12 3456 7890 1234</div>
        <div class="balance" id="balance"></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Recente activiteit</h2>
          <span id="status">laatste 5 acties</span>
        </div>
        <div class="summary" id="summary"></div>
        <ul class="actions" id="actions"></ul>
      </div>

      <button class="analyse" id="analyse">Analyseer gedrag</button>
      <div id="result"></div>
    </div>
  </div>

  <script>
    // Action history per user, injected by the server (see main.py).
    const USERS = __USERS__;

    // Display-only info for the fake app screen.
    const PROFILES = {
      "aaa-aaa-aaa-aaa": { name: "Gebruiker A", balance: "€ 2.345,67" },
      "bbb-bbb-bbb-bbb": { name: "Gebruiker B", balance: "€ 1.120,00" },
      "ccc-ccc-ccc-ccc": { name: "Gebruiker C", balance: "€ 87,40" },
    };

    // How each action is shown in the app: Dutch label, icon and colour.
    const ACTIONS = {
      APP_OPENED: {
        label: "App geopend", short: "Geopend", css: "open",
        icon: "M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3",
      },
      APP_REFRESHED: {
        label: "Saldo vernieuwd", short: "Vernieuwd", css: "refresh",
        icon: "M21 12a9 9 0 1 1-2.64-6.36L21 8M21 3v5h-5",
      },
      APP_CLOSED: {
        label: "App gesloten", short: "Gesloten", css: "close",
        icon: "M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9",
      },
    };
    const WINDOW_SIZE = 5;
    const STEP_MS = 1000; // time between two live actions

    let currentUser = "aaa-aaa-aaa-aaa";
    let playId = 0; // increases on every user switch, so an old playback stops
    let playing = false;

    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    // Build DOM nodes instead of HTML strings, so text is never parsed as HTML (no XSS).
    function el(tag, className, ...children) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.append(...children);
      return node;
    }

    function svg(d) {
      const NS = "http://www.w3.org/2000/svg";
      const icon = document.createElementNS(NS, "svg");
      const attrs = { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round", "stroke-linejoin": "round" };
      for (const [k, v] of Object.entries(attrs)) icon.setAttribute(k, v);
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", d);
      icon.append(path);
      return icon;
    }

    // Summary chips: how often each action occurs in the window.
    function renderSummary(shown, changedKey) {
      $("summary").replaceChildren(
        ...Object.entries(ACTIONS).map(([key, a]) => {
          const count = shown.filter((x) => x === key).length;
          const bump = key === changedKey ? " bump" : "";
          return el("div", `chip ${a.css}${bump}`, el("b", "", `${count}×`), a.short);
        })
      );
    }

    // Add one action on top of the timeline (newest first).
    function addTimelineItem(key) {
      document.querySelectorAll("#actions .tag, #actions .empty").forEach((el) => el.remove());
      const li = document.createElement("li");
      li.className = "enter";
      li.append(
        el("div", `icon ${ACTIONS[key].css}`, svg(ACTIONS[key].icon)),
        el("div", "action-text", el("div", "", ACTIONS[key].label), el("code", "", key)),
        el("span", "tag", "Nieuwste")
      );
      $("actions").prepend(li);
    }

    // Sliding window: the oldest action (at the bottom) fades out.
    function removeOldestItem() {
      const items = $("actions").querySelectorAll("li:not(.leave)");
      const oldest = items[items.length - 1];
      oldest.classList.add("leave");
      setTimeout(() => oldest.remove(), 400);
    }

    function setPlaying(on) {
      playing = on;
      $("status").replaceChildren(on ? el("span", "live", el("i"), "Live") : "laatste 5 acties");
      $("analyse").disabled = on;
      $("analyse").textContent = on ? "Activiteit binnenkomend…" : "Analyseer gedrag";
    }

    // Replay the user's actions one by one, as if they happen live.
    async function playActivity(actions) {
      const id = ++playId;
      const shown = [];
      $("actions").replaceChildren(el("li", "empty", "Wachten op activiteit…"));
      renderSummary(shown, null);
      setPlaying(true);

      for (const [i, key] of actions.entries()) {
        await sleep(i === 0 ? 400 : STEP_MS);
        if (id !== playId) return; // another user was selected

        shown.push(key);
        addTimelineItem(key);
        if (shown.length > WINDOW_SIZE) {
          shown.shift();
          removeOldestItem();
        }
        renderSummary(shown, key);
      }

      if (!actions.length) $("actions").replaceChildren(el("li", "empty", "Nog geen activiteit"));
      setPlaying(false);
    }

    function selectUser(uuid) {
      currentUser = uuid;
      $("greeting").textContent = "Welkom, " + PROFILES[uuid].name;
      $("balance").textContent = PROFILES[uuid].balance;
      $("result").replaceChildren();
      playActivity(USERS[uuid]);
      document.querySelectorAll(".switcher button").forEach((b) =>
        b.classList.toggle("active", b.dataset.uuid === uuid)
      );
    }

    async function analyse() {
      const uuid = currentUser;
      $("analyse").disabled = true;
      try {
        const res = await fetch("/api/v1/behaviour-analysis", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_uuid: uuid }),
        });
        const data = await res.json();
        if (uuid !== currentUser) return; // user switched while waiting

        if (!res.ok) {
          $("result").replaceChildren(el("p", "error", data.error.message));
        } else if (data.prediction === "USER_STRESSED") {
          $("result").replaceChildren(
            el("div", "help",
              el("strong", "", "Alles ok?"),
              " We zien dat je vaak je rekening checkt. Kunnen we je ergens mee helpen?",
              el("div", "reason", data.reason)
            )
          );
        } else {
          $("result").replaceChildren(el("p", "neutral", "Alles in orde, geen actie nodig"));
        }
      } catch (e) {
        $("result").replaceChildren(el("p", "error", "Kan de server niet bereiken."));
      } finally {
        $("analyse").disabled = playing;
        // Make sure the result is visible inside the phone screen.
        $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    }

    // Build the user switcher buttons.
    for (const uuid of Object.keys(PROFILES)) {
      const btn = document.createElement("button");
      btn.textContent = PROFILES[uuid].name;
      btn.dataset.uuid = uuid;
      btn.onclick = () => selectUser(uuid);
      $("switcher").appendChild(btn);
    }
    $("analyse").onclick = analyse;
    selectUser(currentUser);
  </script>
</body>
</html>
